<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 4px 16px rgba(17,24,39,0.06); transition:all 0.3s ease; height:100%; display:flex; flex-direction:column;" style-hover="box-shadow:0 24px 48px rgba(17,24,39,0.12); transform:translateY(-8px);">
  <div style="position:relative; height:200px; flex-shrink:0;">
    <img ref="{{ setImgRef }}" style="width:100%; height:100%; object-fit:cover;" alt=""/>
    <div onClick="{{ handleFav }}" style="position:absolute; top:14px; right:14px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.85); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:transform 0.2s ease;">
      <i class="fa-regular fa-heart" style="color:{{ favColor }}; transform:scale({{ favScale }}); transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1); display:inline-block;" aria-label="Save school"></i>
    </div>
    <div onClick="{{ handleCompare }}" style="position:absolute; top:14px; left:14px; padding:6px 12px; border-radius:100px; background:{{ compareBg }}; color:{{ compareColor }}; font-family:'Satoshi', sans-serif; font-size:11px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px;">
      <i class="{{ compareIcon }}" aria-hidden="true"></i> Compare
    </div>
  </div>
  <div style="padding:20px; display:flex; flex-direction:column; flex:1;">
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
      <div style="font-family:'Clash Display', sans-serif; font-size:18px; font-weight:600;">{{ school.name }}</div>
      <i class="fa-solid fa-circle-check" style="color:#2563EB; font-size:13px;" aria-hidden="true"></i>
    </div>
    <div style="font-family:'General Sans', sans-serif; font-size:13px; color:#6b7280; margin-bottom:12px;"><i class="fa-solid fa-star" style="color:#F97316;" aria-hidden="true"></i> {{ school.rating }} ({{ school.reviews }} reviews)</div>
    <div style="display:flex; margin-bottom:12px;">
      <div style="width:28px; height:28px; border-radius:50%; background:#e0e7ff; border:2px solid #fff; display:flex; align-items:center; justify-content:center; font-size:11px; color:#2563EB;"><i class="fa-solid fa-user" aria-hidden="true"></i></div>
      <div style="width:28px; height:28px; border-radius:50%; background:#dcfce7; border:2px solid #fff; margin-left:-8px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#10B981;"><i class="fa-solid fa-user" aria-hidden="true"></i></div>
      <div style="width:28px; height:28px; border-radius:50%; background:#fed7aa; border:2px solid #fff; margin-left:-8px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#F97316;"><i class="fa-solid fa-user" aria-hidden="true"></i></div>
      <div style="width:28px; height:28px; border-radius:50%; background:#F7F8FA; border:2px solid #fff; margin-left:-8px; display:flex; align-items:center; justify-content:center; font-size:10px; font-family:'Satoshi', sans-serif; color:#6b7280;">+4</div>
    </div>
    <div style="font-family:'General Sans', sans-serif; font-size:13px; color:#6b7280; margin-bottom:16px;"><i class="fa-solid fa-location-dot" style="color:#2563EB;" aria-hidden="true"></i> {{ school.city }} · {{ school.transmission }}</div>
    <div style="margin-top:auto; display:flex; justify-content:space-between; align-items:center;">
      <div style="font-family:'Clash Display', sans-serif; font-size:16px; font-weight:600;">from €{{ school.price }}</div>
      <div style="border:1px solid #2563EB; color:#2563EB; font-family:'Satoshi', sans-serif; font-size:13px; font-weight:600; padding:9px 18px; border-radius:100px; cursor:pointer; transition:all 0.2s ease;" style-hover="background:#2563EB; color:#fff;">Quick Book</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 540}, &quot;school&quot;: {&quot;editor&quot;: null, &quot;default&quot;: {}, &quot;tsType&quot;: &quot;object&quot;}, &quot;isFav&quot;: {&quot;editor&quot;: null, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;isCompared&quot;: {&quot;editor&quot;: null, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;onToggleFav&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(id: string) =&gt; void&quot;}, &quot;onToggleCompare&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(id: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  handleFav = (e) => {
    e.stopPropagation();
    if (this.props.onToggleFav) this.props.onToggleFav(this.props.school.id);
  };
  handleCompare = (e) => {
    e.stopPropagation();
    if (this.props.onToggleCompare) this.props.onToggleCompare(this.props.school.id);
  };
  renderVals() {
    const isFav = !!this.props.isFav;
    const isCompared = !!this.props.isCompared;
    const school = this.props.school || {};
    return {
      school,
      handleFav: this.handleFav,
      handleCompare: this.handleCompare,
      setImgRef: (el) => { if (el && school.image) el.src = school.image; },
      favColor: isFav ? '#F97316' : '#9ca3af',
      favScale: isFav ? 1.15 : 1,
      compareBg: isCompared ? '#2563EB' : 'rgba(255,255,255,0.85)',
      compareColor: isCompared ? '#fff' : '#374151',
      compareIcon: isCompared ? 'fa-solid fa-check' : 'fa-solid fa-plus',
    };
  }
}

</script>
</body>
</html>
